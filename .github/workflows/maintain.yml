name: Maintain dashboard

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: "Comma-separated run ids to remove"
        required: true
        type: string

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Remove runs
        run: node scripts/remove-runs.mjs --ids "${{ inputs.run_ids }}"

      - name: Commit
        run: |
          git config user.name "spectra-health-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "maintain: remove ${{ inputs.run_ids }}"
          git push

# Copy into a frontend repo Spectra workflow (e.g. spectra-pr.yml).
# Upload reports on pass or fail, then publish with a normal job (not a reusable workflow).
#
# Secret on the frontend repo: SPECTRA_DASHBOARD_TOKEN
#   fine-grained PAT, Contents: Read and write on sentikatechOrg/spectra-health-dashboard

      - name: Upload Spectra reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectra-reports-pr-${{ github.event.pull_request.number || github.run_number }}
          path: spectra/reports/**
          retention-days: 14
          if-no-files-found: ignore

  publish-health:
    name: publish-to-health-dashboard
    needs: alarm
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout health dashboard
        uses: actions/checkout@v4
        with:
          repository: sentikatechOrg/spectra-health-dashboard
          token: ${{ secrets.SPECTRA_DASHBOARD_TOKEN }}
          path: dashboard

      - name: Download Spectra reports
        uses: actions/download-artifact@v4
        with:
          name: spectra-reports-pr-${{ github.event.pull_request.number || github.run_number }}
          path: reports

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ingest report and push to dashboard
        working-directory: dashboard
        env:
          SOURCE_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          OWNER: ${{ github.event.pull_request.user.login || github.event.head_commit.author.username || github.actor }}
        run: |
          WORKFLOW_URL="https://github.com/${SOURCE_REPO}/actions/runs/${RUN_ID}"
          node scripts/ci-ingest.mjs \
            --reports ../reports \
            --data data \
            --repo "$SOURCE_REPO" \
            --run-id "$RUN_ID" \
            --pr "$PR" \
            --branch "$BRANCH" \
            --owner "$OWNER" \
            --workflow-url "$WORKFLOW_URL"
          git config user.name "spectra-health-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "ingest: ${SOURCE_REPO} run ${RUN_ID}"
          git push
